<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Answer</title>
<style>body{font:20px -apple-system,sans-serif;display:flex;min-height:90vh;align-items:center;justify-content:center;margin:0}
a{background:#f5c400;color:#000;padding:16px 28px;border-radius:14px;text-decoration:none;font-weight:600}</style></head>
<body><a id="go" href="#">Answer in Messages</a>
<script>
// reply-link v1: opens Messages with a short answer already typed, to the handle in the link. Stores nothing.
var q=new URLSearchParams(location.search),t=q.get("to")||"",b=q.get("b")||"";
if(/^(\+?[0-9]{7,15}|[^@\s:?&\/]+@[^@\s:?&\/]+\.[a-z]{2,})$/i.test(t)&&/^([A-Z][0-9]{1,2} )?[0-9]{1,2}$/.test(b)){
var u="sms:"+encodeURIComponent(t).replace(/%2B/g,"+").replace(/%40/g,"@")+"&body="+encodeURIComponent(b);
document.getElementById("go").href=u;location.replace(u);}
else{document.body.textContent="This link is missing its answer.";}
</script></body></html>
